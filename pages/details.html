<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLib - The Dark Night</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header>
        <div>
            <nav>
                <a href="../index.html">
                    <img src="../assets/images/mlib-icon.svg" alt="MLib Logo Icon" height="32">
                    <span>MLib</span>
                </a>
            </nav>
        </div>

        <nav>
            <a href="../pages/add-review.html">
                <button class="button" aria-label="Add new movie review">+</button>
            </a>
        </nav>
    </header>

    <main>
        <div class="movie-details-container">
            <div class="movie-poster">
                <img src="https://placehold.co/380x570" alt="Movie Poster">
            </div>

            <div class="review">
                <h1 class="movie-title">The Dark Night</h1>
                
                <div class="movie-section">
                    <p><strong>Watched on:</strong> 05/30/2025</p>
                </div>

                <div class="movie-section rating-details">
                    <p><strong>Rating:</strong></p>
                    <div class="rating">
                        <span>★</span><span>★</span><span>★</span><span>★</span><span class="star-empty">★</span>
                    </div>
                </div>

                <di class="movie-section">
                    <p class="r-title"><strong>Review:</strong><br>
                    An epic conclusion to Nolan's triology. Excellent visuals, strong performances, and a powerful soundtrack.</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 MLib &ndash; My Movie Library</p>
    </footer>

</html>
